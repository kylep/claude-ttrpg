# Player-facing feature descriptions, written for a young player at the table.
# These are the kid-voice counterpart to the GM/engine text in features.yaml:
# the viewer shows a feature's blurb here when a player clicks its chip. One or
# two short, plain sentences each — what the feature does for the hero, no dice
# notation or engine jargon. Keyed by the same feature id as features.yaml.

# ---- Fighter ----------------------------------------------------------------
second_wind: "Catch your breath in the middle of a fight and heal up a little, once between rests."
combat_style: "Pick a favorite way to fight — blade, shield, bow, or fists — and you're extra good at it forever."
battle_focus: "You have a pool of focus you can spend to add a lucky boost to an attack, save, or check."
deep_reserves: "Your Second Wind heals more, and you can use it twice between rests."
extra_attack: "When you attack, you swing twice instead of once."
sharper_focus: "Your focus boost gets bigger, and you have more of it to spend."
battle_tested: "You're quick off the mark in a fight and can never be caught by surprise."
extra_wind: "You can use Second Wind one more time between rests."
indomitable: "Once between long rests, if you fail a save, you can try that roll again."
keen_focus: "Your focus boost grows bigger still."
improved_extra_attack: "When you attack, you swing three times."
relentless_focus: "Land a perfect hit and you get some spent focus back right away."
hardened_resolve: "You can shrug off a failed save and reroll it twice between long rests."
mighty_focus: "Your focus boost grows even bigger."
unyielding: "When you reroll a failed save, you get two tries and keep the better one."
master_at_arms: "You learn a second fighting style, and once a turn you can retry a missed swing."
sure_strike: "Your hits land as big lucky blows more often."
third_wind: "You have even more focus to spend and can bounce back from failed saves more often."
tireless: "When you're badly hurt in a fight, you heal a little at the start of each turn."
champion: "You swing four times when you attack, and your focus boost is always its very best."

# ---- Barbarian --------------------------------------------------------------
rage: "Fly into a roaring rage: you hit harder and take less of a beating until the fight ends."
unarmored_defense: "With no armor on, your own toughness protects you the way armor would."
wild_sprint: "You run faster all the time, and rough ground never slows you down."
reckless_assault: "Attack wildly — it's easier for you to hit, but easier for foes to hit you too."
rugged_recovery: "You can rage a second time each day, and catch your breath to heal between fights."
surging_fury: "Your rage hits harder."
feral_resilience: "While raging, nothing can scare you and you shrug off dangers more easily."
danger_sense: "You feel danger coming — traps, blasts, and ambushes rarely catch you."
hardened_hide: "While raging, fire, cold, and lightning hurt you only half as much."
brutal_strike: "Your rage hits even harder, and once a turn you can pile on an extra blow."
tireless_fury: "You can rage three times a day and catch your breath more often."
relentless_rage: "Your rage hits harder, and a blow that would drop you might leave you standing on 1 health."
unbroken_will: "Nothing can ever scare you, and you shrug off poison and sickness easily."
call_of_the_wild: "The wild is your home — you're great at outdoor skills, and wild animals shy away from you."
deeper_fury: "You can rage four times a day, and your first hit each rage is always a big one."
persistent_rage: "Your rage no longer fades on its own — you keep going until you choose to stop or the fight ends."
iron_constitution: "Your rage hits as hard as it can, and you gain extra health at every level."
might_of_the_wilds: "While raging, your blows hit twice as hard and land more easily."
unstoppable: "While raging, nothing can knock you down or tie you up."
endless_fury: "You can rage as many times a day as you need."
avatar_of_fury: "In a full rage you become unstoppable — huge hits, easy critical blows, and normal weapons barely scratch you."

# ---- Rogue ------------------------------------------------------------------
sneak_attack: "Catch a foe off guard and your hit deals a big burst of extra damage."
deft_hands: "With your tools in hand, you're amazing at picking locks, disarming traps, and lifting things unseen."
rogue_expertise: "Pick two skills you're best at — you're extra good at them for the rest of your life."
cunning_action: "Each turn you get a free extra move to dash, slip away safely, or hide."
quick_step: "You move faster, and dashing lets you ignore rough ground."
uncanny_dodge: "Your sneak damage is at its biggest, and once a round you can halve a hit that lands on you."
combat_instincts: "You read a fight early and can never be surprised."
evasion: "When you dodge a blast or trap, a good dodge means you take no damage at all."
greater_deft_hands: "Easy locks and traps just pop open for you, no roll needed."
reliable_talent: "Your best skills almost never fail — a low roll still counts as a solid one."
shadow_step: "In shadow, you can slip right past an enemy that's blocking your way."
improved_sneak: "Once a round you can land a second sneak attack on another good hit."
steady_nerve: "Even at death's door you get two tries on each save and keep the better."
slippery_mind: "Your wits can't be broken — nothing scares or tricks your mind, and you dodge mind-magic."
keen_eye: "You're great at spotting traps, hidden doors, and ambushes before they spring."
elusive: "You're so slippery that foes rarely get an easy shot at you."
deadly_precision: "Your hits become big lucky blows more often."
stroke_of_luck: "Once between rests, turn one missed attack or failed check into a perfect roll."
greater_evasion: "You dodge so well that even a direct blast hurts you only half as much."
point_blank_shot: "You can fire your bow right next to an enemy with no trouble."
perfect_ambush: "Strike first from hiding and your opening hit is a devastating sneak attack."

# ---- Monk -------------------------------------------------------------------
martial_arts: "Your hands and feet are weapons — you strike fast, add an extra punch, and hit hard without a blade."
ki: "You carry a pool of inner energy called ki that powers your special monk moves, refilled when you rest."
unarmored_movement: "With no armor on, you move faster all the time."
flurry_of_blows: "Spend a little ki to throw two extra lightning-fast strikes after you attack."
deflect_missiles: "Catch or swat away an arrow flying at you, then hurl it right back."
step_of_the_wind: "Spend ki to zip away safely and leap extra far."
stunning_strike: "Your strikes hit harder, and you can spend ki to leave a foe stunned and helpless."
purity_of_body: "You can't get sick or poisoned, and your strikes hurt even magical monsters."
slow_fall: "You can slow your own fall and take much less damage from a big drop."
wholeness_of_body: "Once a day you can heal yourself with a calm, focused breath."
stillness_of_mind: "Once a day you can calm your mind and shake off fear or a charm."
improved_flurry: "Your strikes hit harder, and your first flurry each turn is free."
diamond_soul: "You're great at every kind of save, and can spend ki to reroll one you fail."
tongue_of_sun_and_moon: "You can understand and talk with any creature that can speak."
focused_ki: "Your ki moves always work, and a perfect hit gives you some ki back."
timeless_body: "You barely age, and hunger and thirst hardly bother you."
empty_body: "Spend ki to turn invisible for a short while — even while moving and fighting."
quivering_palm: "Set a hidden shiver in a foe's body, then trigger it later for a huge, deadly blow."
unerring_body: "Once between rests you can retry a missed punch or staff strike."
deepened_ki: "Your invisibility costs less ki, and you can reroll saves more often."
perfect_self: "If you ever run out of ki you get some back, and your strikes land big lucky blows more often."

# ---- Wizard -----------------------------------------------------------------
spellbook: "Your book holds all your spells, and studying it helps you puzzle out magic you find."
arcane_recovery: "Take a short rest and study your book to get some used-up spells back."
ritual_casting: "You can slowly cast your handy, non-fighting spells for free, without using them up."
spell_secrets: "Once a day you can cast one spell for free, without using it up."
improved_recovery: "Your short-rest study gets back even more used-up spells."
arcane_mastery: "Once a day you can make a foe's save against your spell much harder."
potent_spellcasting: "Your simplest spells hit harder, adding your smarts to the damage."
spell_mastery: "Pick two favorite spells — from now on you can cast them as often as you like for free."
archmage: "Once a day you can cast two big spells for free, and one favorite spell always costs less."

# ---- Cleric -----------------------------------------------------------------
channel_light: "Call on your holy light to either burn a foe or heal a friend, once between rests."
turn_undead: "Hold up your holy symbol and send nearby undead fleeing from your light."
divine_domain: "Pick what your faith is best at — light, life, war, or knowledge — for a lasting edge."
greater_channel_light: "Your holy light burns and heals more strongly, and you can use it twice between rests."
divine_strike: "Once a turn, your weapon hits also blaze with extra holy light."
sacred_ward: "Once a day, when you or a friend nearby would fall, you keep them standing on 1 health."
improved_channel_light: "Your holy light is stronger still, and you can use it three times between rests."
divine_intervention: "Once a day you can call on your patron for a dramatic miracle to help the party."

# ---- Druid ------------------------------------------------------------------
nature_bond: "Animals treat you as a friend, and you know the wild — its weather, plants, and beasts."
wild_shape: "Transform into a beast, taking its shape, speed, and strength until you change back."
verdant_step: "Plants and thickets never slow you, and you hide well out in nature."
greater_wild_shape: "You can turn into bigger beasts now, and even swimming ones."
primal_strike: "Your beast attacks and nature weapons carry extra elemental damage."
thousandfold_shape: "You can wild shape more often, and your beast forms can still do clever little things with paws or voice."
mastery_of_forms: "You can turn into large beasts — and, for the first time, flying ones."
primeval_awareness: "Once a day you can sense what dangerous creatures lurk within a day's travel."
elder_wild_shape: "You can become the mightiest beasts, or spend extra to take a truly powerful form."
apex_wild_shape: "Beast forms you've used before are free to enter, and your beast shapes hit even harder."
archdruid: "You can wild shape as much as you like and stay a beast as long as you want — and even cast a spell while transformed."
